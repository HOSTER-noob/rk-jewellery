name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build_full.log

      - name: Publish error log (on failure)
        if: failure()
        shell: bash
        run: |
          grep -aE "^e: |error:|Caused by|What went wrong|FAILURE" build_full.log | head -120 > errors.txt || true
          tail -40 build_full.log >> errors.txt || true
          echo "===== BUILD ERRORS ====="
          cat errors.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add errors.txt
          git commit -m "CI: build error log [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RK-Jewellery-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
